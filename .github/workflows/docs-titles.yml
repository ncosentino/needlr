name: Documentation titles

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/hooks/**'
      - 'docs/requirements.txt'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'scripts/test-docs-titles.py'
      - '.github/workflows/docs-titles.yml'
  push:
    branches: [main]
    paths:
      - 'docs/hooks/**'
      - 'docs/requirements.txt'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'scripts/test-docs-titles.py'
      - '.github/workflows/docs-titles.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-titles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  titles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Validate rendered documentation titles
        run: python scripts/test-docs-titles.py
